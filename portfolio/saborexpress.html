<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SaborExpress - Restaurante</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #FFFDF9; color: #333; }
        .webadapt-banner { background: #0F172A; color: white; text-align: center; padding: 10px; }
        header { padding: 20px; color: #FF4B2B; font-size: 28px; font-weight: 800; border-bottom: 1px solid #eee; }
        .hero { padding: 60px; text-align: center; }
        .btn { background: #FF4B2B; color: white; padding: 10px 20px; border-radius: 20px; text-decoration: none; }
        .menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 40px; }
        .dish { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="webadapt-banner">Site Exemplo: SaborExpress | <a href="../portfolio.html" style="color: #3B82F6;">Voltar</a></div>
    <header>SaborExpress</header>
    <section class="hero"><h1>Fome de Comida Boa?</h1><p>Entregamos em minutos.</p><a href="#" class="btn">Ver Cardápio</a></section>
    <section class="menu"><div class="dish">Burger</div><div class="dish">Pizza</div><div class="dish">Salada</div></section>
</body>
</html>
