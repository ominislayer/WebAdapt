<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>TechConnect - Tecnologia</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #0B0F19; color: #E2E8F0; }
        .webadapt-banner { background: #000; color: white; text-align: center; padding: 10px; border-bottom: 1px solid #333; }
        header { padding: 20px; font-size: 24px; font-weight: 700; color: #fff; border-bottom: 1px solid #1a1a1a; }
        .hero { padding: 80px; text-align: center; }
        .highlight { color: #00D2FF; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 40px; }
        .card { background: #151A27; padding: 20px; border-radius: 10px; border: 1px solid #222; }
    </style>
</head>
<body>
    <div class="webadapt-banner">Site Exemplo: TechConnect | <a href="../portfolio.html" style="color: #3B82F6;">Voltar</a></div>
    <header>TechConnect</header>
    <section class="hero"><h1>O futuro na palma da <span class="highlight">sua mão.</span></h1></section>
    <section class="grid"><div class="card">Smartphone</div><div class="card">Notebook</div><div class="card">Acessórios</div></section>
</body>
</html>
